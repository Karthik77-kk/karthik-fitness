name: Token permission check

# Verifies KFIT_APP_TOKEN actually carries the scopes the CI migration needs,
# by EXERCISING them rather than trusting the settings page. A fine-grained PAT
# does not report its own permissions through the API, so the only honest check
# is to make the calls and see which ones come back 403.
#
# Every write here is a no-op: the PR title is PATCHed to the value it already
# has. That requires Pull requests: write and changes nothing observable.
#
# Throwaway — delete once auto-merge has moved and is exercising these for real.

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
      REPO: Karthik77-kk/kfit-app
    steps:
      - name: Contents read
        run: |
          gh api "repos/$REPO/contents/pubspec.yaml" --jq '.name' >/dev/null \
            && echo "✅ Contents: read" || { echo "❌ Contents: read MISSING"; exit 1; }

      - name: Pull requests read
        run: |
          gh api "repos/$REPO/pulls?state=all&per_page=1" --jq '.[0].number' >/dev/null \
            && echo "✅ Pull requests: read" || { echo "❌ Pull requests: read MISSING"; exit 1; }

      - name: Commit statuses write
        run: |
          SHA=$(gh api "repos/$REPO/commits?per_page=1" --jq '.[0].sha')
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state=success -f context="token-permission-check" \
            -f description="scope probe" >/dev/null \
            && echo "✅ Commit statuses: write" || { echo "❌ Commit statuses: write MISSING"; exit 1; }

      - name: Pull requests WRITE (the new one)
        run: |
          # PATCH a closed PR's title to its current value: a real write call,
          # zero observable change.
          N=$(gh api "repos/$REPO/pulls?state=closed&per_page=1" --jq '.[0].number')
          T=$(gh api "repos/$REPO/pulls/$N" --jq '.title')
          if gh api -X PATCH "repos/$REPO/pulls/$N" -f title="$T" >/dev/null 2>&1; then
            echo "✅ Pull requests: write — auto-merge replacement is unblocked"
          else
            echo "❌ Pull requests: write MISSING — add it to KFIT_APP_TOKEN"
            exit 1
          fi
