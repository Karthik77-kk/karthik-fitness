name: Auto-merge on green

# Enables GitHub NATIVE auto-merge (squash) for non-draft PRs. GitHub then merges
# the PR automatically ONLY once every required status check passes — i.e. the
# "Verify (analyze + test)" gate in pr-quality-gate.yml. This cannot be fooled by
# comments: the merge is gated by branch protection's required check, not by text.
#
# Requires the repo setting: Settings -> General -> Pull Requests -> "Allow auto-merge".

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft status is the primary guard. Title-based checks are a secondary,
    # belt-and-suspenders net for a PR that's ready-for-review but not
    # actually meant to auto-merge yet — contains()/startsWith() are case-
    # insensitive in GitHub Actions expressions, so this catches "WIP", "Wip",
    # "wip", etc. without extra logic.
    #
    # Dependabot is excluded on purpose: its workflow runs get a read-only token
    # with no access to RELEASE_PAT (so the merge would fail anyway), and a
    # toolchain bump should never auto-ship a release — Karthik merges those by
    # hand after a look.
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.title, 'wip') &&
      !contains(github.event.pull_request.title, 'do not merge') &&
      !contains(github.event.pull_request.title, '[skip auto-merge]')
    steps:
      - name: Enable native auto-merge (squash)
        uses: actions/github-script@v7
        with:
          # Use a fine-grained PAT (RELEASE_PAT) so the merge is attributed to a real
          # user, which lets the push to main trigger build_apk.yml. With the default
          # GITHUB_TOKEN, GitHub suppresses downstream workflow runs (anti-recursion),
          # so the release would NOT build. Falls back to github.token if unset.
          github-token: ${{ secrets.RELEASE_PAT || github.token }}
          script: |
            const prId = context.payload.pull_request.node_id;
            const mutation = `mutation($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                pullRequest { number }
              }
            }`;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // "Pull request is in unstable status" is a brief, self-clearing
            // race: this workflow and pr-quality-gate.yml both fire off the
            // same pull_request event, and GitHub can reject the mutation if
            // it lands mid-recompute of the other check's status. Retrying a
            // few times a few seconds apart reliably clears it — confirmed
            // 2026-07-09 on PR #3, which needed a manual re-run because this
            // wasn't retried and the job just logged and gave up.
            const attempts = 5;
            for (let i = 1; i <= attempts; i++) {
              try {
                await github.graphql(mutation, { id: prId });
                core.info('✅ Native auto-merge enabled (squash). PR will merge when required checks pass.');
                return;
              } catch (e) {
                const transient = /unstable status/i.test(e.message);
                if (transient && i < attempts) {
                  core.info(`ℹ️ PR not stable yet (attempt ${i}/${attempts}), retrying in 10s: ${e.message}`);
                  await sleep(10000);
                  continue;
                }
                // Other non-fatal reasons: "Allow auto-merge" not enabled in
                // repo settings, PR already mergeable/merged, or no required
                // checks configured.
                core.info('ℹ️ Could not enable auto-merge: ' + e.message);
                return;
              }
            }
