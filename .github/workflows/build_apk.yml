              lines = [
                  pkg_line,
                  '',
                  'import android.content.Intent',
                  'import android.content.pm.PackageManager',
                  'import android.net.Uri',
                  'import android.os.Build',
                  'import android.os.PowerManager',
                  'import android.view.WindowManager',
                  'import android.provider.Settings',
                  'import io.flutter.embedding.android.FlutterActivity',
                  'import io.flutter.embedding.engine.FlutterEngine',
                  'import io.flutter.plugin.common.MethodChannel',
                  'import java.security.MessageDigest',
                  '',
                  '@Suppress("DEPRECATION")',
                  'class MainActivity: FlutterActivity() {',
                  '    private val CHANNEL = "com.kfitness/battery"',
                  '    private val PRIVACY_CHANNEL = "com.kfitness/privacy"',
                  '',
                  '    // Hides the app from the recents switcher while it is in the',
                  '    // background, WITHOUT blocking screenshots while it is in use —',
                  '    // people screenshot their progress to share it, and a fitness app',
                  '    // that refuses is worse than one that shows a thumbnail.',
                  '    //',
                  '    // Set on pause and cleared on resume, because the system takes the',
                  '    // recents snapshot around pause. Only armed when the user has set a',
                  '    // PIN: someone who locked the app has asked for this, and someone',
                  '    // who has not should keep normal behaviour.',
                  '    private var hideInRecents = false',
                  '',
                  '    override fun onPause() {',
                  '        if (hideInRecents) {',
                  '            window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)',
                  '        }',
                  '        super.onPause()',
                  '    }',
                  '',
                  '    override fun onResume() {',
                  '        super.onResume()',
                  '        window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)',
                  '    }',
                  '    private val INTEGRITY_CHANNEL = "com.kfitness/integrity"',
                  '',
                  '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {',
                  '        super.configureFlutterEngine(flutterEngine)',
                  '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)',
                  '            .setMethodCallHandler { call, result ->',
                  '                when (call.method) {',
                  '                    "requestIgnoreBatteryOptimizations" -> {',
                  '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {',
                  '                            val pm = getSystemService(POWER_SERVICE) as PowerManager',
                  '                            if (!pm.isIgnoringBatteryOptimizations(packageName)) {',
                  '                                val intent = Intent(',
                  '                                    Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
                  '                                )',
                  '                                intent.data = Uri.parse("package:$packageName")',
                  '                                startActivity(intent)',
                  '                            }',
                  '                        }',
                  '                        result.success(true)',
                  '                    }',
                  '                    "isIgnoringBatteryOptimizations" -> {',
                  '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {',
                  '                            val pm = getSystemService(POWER_SERVICE) as PowerManager',
                  '                            result.success(pm.isIgnoringBatteryOptimizations(packageName))',
                  '                        } else {',
                  '                            result.success(true)',
                  '                        }',
                  '                    }',
                  '                    "openNotificationSettings" -> {',
                  '                        val intent = Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)',
                  '                        intent.putExtra(Settings.EXTRA_APP_PACKAGE, packageName)',
                  '                        startActivity(intent)',
                  '                        result.success(true)',
                  '                    }',
                  '                    "openExactAlarmSettings" -> {',
                  '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {',
                  '                            val intent = Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM)',
                  '                            intent.data = Uri.parse("package:$packageName")',
                  '                            startActivity(intent)',
                  '                        }',
                  '                        result.success(true)',
                  '                    }',
                  '                    else -> result.notImplemented()',
                  '                }',
