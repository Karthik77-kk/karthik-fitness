name: Build Android APK

# Builds and releases kfit-app FROM HERE, in the public repo.
#
# Ported from kfit-app's own build_apk.yml on 2026-08-14, when the account hit
# 3,000/3,000 Actions minutes and every private workflow began failing before
# starting. The build steps below are the original, unchanged — only the way it
# is TRIGGERED, where it CHECKS OUT from, and which token PUBLISHES have moved.
# Everything about how the APK is produced (signing, Shorebird, the rejected-
# patch fallback, the arm64 flags, the icon step, the size filters) is the same
# file it always was, deliberately (see feedback: port checks verbatim).
#
# ── What changed, and only this ─────────────────────────────────────────────
#   trigger    push-to-main  ->  a poll of kfit-app's main (see below)
#   source     this repo     ->  kfit-app, checked out with KFIT_APP_TOKEN
#   publish    RELEASE_PAT   ->  github.token
#
# That last one is a simplification, not a workaround. The release was always
# published to kfit; this workflow now RUNS in kfit, so a cross-repo publish
# became a same-repo one and the PAT is no longer needed at all.
#
# ── Why it POLLS ────────────────────────────────────────────────────────────
# Same reason as the gate and the auto-merge sweep: a repository_dispatch from
# kfit-app needs a workflow run IN kfit-app, which needs minutes, and there are
# none. The trigger is circular at exactly the moment it is needed. The
# dispatch below is kept as a fast path for when minutes return; the cron stays
# permanently, because it is what survives the next exhaustion.
#
# ── How it knows what is new ────────────────────────────────────────────────
# A push gave `github.event.before` for free. A poll has no such thing, and the
# obvious substitute — the last release tag — is WRONG here: Dart-only merges
# ship as Shorebird patches and cut no release, so the tag lags behind what has
# actually been processed and the same commits would be patched over and over,
# every cycle, forever.
#
# So the last processed commit is recorded as a `ci/last-built` tag on kfit-app,
# moved only after a run succeeds. Absent (first run, or someone deleted it) it
# falls back to a full release of HEAD, which is the safe direction: it ships
# something rather than silently skipping, and it re-establishes the marker.

on:
  schedule:
    # Offset from the gate ("*/10") and the auto-merge sweep ("4-59/10") so the
    # three do not all wake at once. GitHub's scheduler is best-effort and in
    # practice drifts a long way — observed ~45 minutes between fires on this
    # repo — so this is a floor on latency, never a promise.
    - cron: "8-59/15 * * * *"
  # Fast path for when the quota resets on 2026-09-01. Additive: the cron above
  # is never removed, or the circular dependency comes straight back.
  repository_dispatch:
    types: [private-release]
  workflow_dispatch:
    inputs:
      ref:
        description: "kfit-app ref to build (blank = main). Validation only — never publishes."
        required: false
      force:
        description: "Build even if no new commits since ci/last-built"
        required: false
        type: boolean
        default: false

# Serialize releases. Two builds racing (e.g. a manual re-run overlapping a
# real merge) can compute the same version tag — versionCode is derived from
# commit count, so two runs checking out around the same time can land on an
# identical number. cancel-in-progress: false queues instead of racing; if
# several merges land faster than the ~10min build, GitHub keeps only the
# most recently queued run and drops earlier pending ones (not the running
# one) — no commits are lost, they just ship together in the next release
# that actually runs, rather than each merge getting its own APK.
concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  PRIVATE_REPO: Karthik77-kk/kfit-app
  # Moved only after a successful run. This is the poller's replacement for
  # `github.event.before`.
  LAST_BUILT_TAG: ci/last-built

jobs:
  # Dynamic build gate: decide at RUNTIME whether this push actually changed
  # anything that can affect the APK. A merge that only touched docs, CI config,
  # the website, or tests produces a functionally-identical APK — building and
  # releasing it just prompts every user to "update" for nothing and burns ~15
  # min of runner time. This computes the real changed-file set for the push
  # (its before→after range) and only lets the build job run when app code moved.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # read the merged PR's labels for [patch]/[full-release] overrides
    outputs:
      build:  ${{ steps.check.outputs.build }}
      mode:   ${{ steps.check.outputs.mode }}
      sha:    ${{ steps.check.outputs.sha }}
      before: ${{ steps.check.outputs.before }}
    steps:
      - name: Check out the private source
        uses: actions/checkout@v7
        with:
          repository: Karthik77-kk/kfit-app
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.KFIT_APP_TOKEN }}
          fetch-depth: 0
          # Fetch the marker tag too: it is what stands in for
          # `github.event.before`, and without tags it silently looks like a
          # first run and rebuilds everything.
          fetch-tags: true
          # The token must not survive into the workspace git config — later
          # steps run code from the repo under build.
          persist-credentials: false
      - name: Decide build mode (skip / silent patch / full release)
        id: check
        env:
          # Reads the private repo's PRs for the [patch]/[full-release] labels.
          GH_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
        run: |
          # HYBRID SHOREBIRD GATE — from the ACTUAL changed files, pick the
          # cheapest correct way to ship this merge. Three outcomes:
          #   skip    — nothing that reaches the APK changed (docs, website,
          #             tests, other CI). No build, no release, no user update.
          #   patch   — the change is 100% Dart (lib/ only) → `shorebird patch`:
          #             a tiny silent OTA applied on next launch. No APK, no
          #             GitHub release, no version bump.
          #   release — something a patch CANNOT carry changed (native/android,
          #             bundled assets, pubspec dependencies, or this build
          #             workflow) → full `shorebird release`: new APK + GitHub
          #             release, and the baseline future patches diff against.
          # Why the boundary is exactly "lib/ only": a patch replaces only the
          # Dart AOT (libapp.so) and rides on the installed release's native code
          # and assets, which it cannot change — Shorebird's own --allow-asset-diffs
          # help states "asset changes cannot be included in a patch". So the
          # classification is conservative by design: when in doubt, it releases.
          # Overrides — labels on the merged PR, checked BEFORE the file scan:
          #   [skip]         force skip  (a CI/comment-only change to this workflow)
          #   [patch]        force patch (adding a PURE-Dart dependency — it compiles
          #                  into the patch even though pubspec changed)
          #   [full-release] force a full release
          # A poll has no `github.event.before`. The previous processed commit is
          # the `ci/last-built` tag on the private repo, moved only after a run
          # succeeds — see the header for why the last RELEASE tag cannot be used
          # instead (patches cut no release, so it lags and the same commits get
          # patched every cycle, forever).
          AFTER=$(git rev-parse HEAD)
          BEFORE=$(git rev-parse -q --verify "refs/tags/${LAST_BUILT_TAG}^{commit}" 2>/dev/null || true)
          echo "sha=${AFTER}"    >> "$GITHUB_OUTPUT"
          echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"

          # Nothing new since the last successful run. This is the common case
          # on a cron and must be cheap and silent, not a failure.
          if [ -n "$BEFORE" ] && [ "$BEFORE" = "$AFTER" ] \
             && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "mode=skip"   >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already built ${AFTER} — nothing new."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ -z "$BEFORE" ] || \
             ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Can't compute a diff → full release (also validates the workflow itself).
            MODE=release
            echo "reason=manual/dispatch or no valid base — full release"
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
            echo "Changed files in this push:"; echo "$FILES"
            # Only files that actually go into / affect the APK matter here.
            APP_FILES=$(echo "$FILES" | grep -E '^(lib/|android/|assets/|pubspec\.(yaml|lock)$|\.github/workflows/build_apk\.yml$)' || true)

            # build_apk.yml is BOTH the build recipe AND this gate's own CI
            # plumbing, so its filename alone can't say whether an edit changes
            # the APK. Resolve it dynamically: count it as an app change ONLY when
            # its `build:` job (the part that actually produces the APK) differs
            # from the previous commit. A detect-logic / comment / workflow-config
            # edit leaves the APK byte-identical, so it auto-skips with no [skip]
            # label needed. Comments and blank lines are ignored in the compare; a
            # real build-step change still counts. Extraction failure falls back to
            # treating it as an app change (safe).
            CI_SELF='.github/workflows/build_apk.yml'
            if echo "$FILES" | grep -qx "$CI_SELF"; then
              build_job() {
                git show "$1:$CI_SELF" 2>/dev/null \
                  | awk '/^  build:/{f=1} f&&/^  [A-Za-z]/&&!/^  build:/{exit} f{print}' \
                  | grep -vE '^[[:space:]]*(#|$)' || true
              }
              NEW_JOB=$(build_job "$AFTER")
              if [ -n "$NEW_JOB" ] && [ "$(build_job "$BEFORE")" = "$NEW_JOB" ]; then
                APP_FILES=$(echo "$APP_FILES" | grep -vx "$CI_SELF" || true)
                echo "note: $CI_SELF changed but its build job is unchanged — APK unaffected, not counted as an app change"
              fi
            fi

            # Manual overrides via the merged PR's labels (Rule 23 — computed, but
            # you can force either way). Look up the PR(s) associated with this
            # merge commit; empty/permission-less lookup just means "no override".
            LABELS=$(gh api "repos/${{ env.PRIVATE_REPO }}/commits/${AFTER}/pulls" \
                       --jq '.[].labels[].name' 2>/dev/null | tr '\n' ' ' || true)
            echo "PR labels: ${LABELS:-<none>}"

            # An override is ALSO honoured when written into the merge commit
            # message — which, on a squash merge, is the PR title plus body.
            # Applying a real label means opening the PR's sidebar and creating
            # the label if it doesn't exist yet; typing "[full-release]" into the
            # title looks like it should work and reads identically to a human,
            # so it silently did nothing (2026-08-13: two PRs marked that way in
            # the title both skipped, because only labels were read).
            #
            # The BRACKETED form is required here. A bare word is not enough:
            # "patch" turns up in ordinary subjects all the time ("fix the patch
            # flow"), and matching it loosely would silently downgrade a real
            # release to an OTA patch.
            # Matched with shell globs, not grep: the marker is a literal that
            # contains regex metacharacters ([ ]), so every grep form needs
            # escaping or -F, and `case` needs neither. Lowercase the message
            # once so "[Full-Release]" works as well as "[full-release]".
            MSG_LC=$(git log -1 --pretty=format:'%B' "$AFTER" | tr 'A-Z' 'a-z')
            OVERRIDE_SRC=""
            has_override() {
              case " $LABELS " in *" $1 "*) OVERRIDE_SRC="label";          return 0 ;; esac
              case "$MSG_LC"    in *"[$1]"*) OVERRIDE_SRC="commit message"; return 0 ;; esac
              return 1
            }

            # Explicit overrides win (most specific first). [skip] lets a
            # CI/comment-only change to this workflow avoid a needless release
            # (and the "update available" prompt for a byte-identical app).
            if has_override skip; then
              MODE=skip;    echo "reason=forced by [skip] (${OVERRIDE_SRC})"
            elif has_override full-release; then
              MODE=release; echo "reason=forced by [full-release] (${OVERRIDE_SRC})"
            elif has_override patch; then
              MODE=patch;   echo "reason=forced by [patch] (${OVERRIDE_SRC})"
            elif [ -z "$APP_FILES" ]; then
              MODE=skip;    echo "reason=no app-relevant files (docs/website/tests/other CI) — nothing to ship"
            else
              # Everything under lib/ is Dart → patchable. List anything else that
              # reaches the APK; if that list is empty the change is Dart-only.
              UNPATCHABLE=$(echo "$APP_FILES" | grep -vE '^lib/' || true)
              if [ -z "$UNPATCHABLE" ]; then
                MODE=patch;   echo "reason=Dart-only (all app changes under lib/) — silent patch"
              else
                MODE=release
                echo "reason=full release — a patch cannot carry these changes:"
                echo "$UNPATCHABLE" | sed 's/^/  - /'
              fi
            fi
          fi

          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          [ "$MODE" = "skip" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          echo "### Build gate: **${{ steps.check.outputs.mode }}**" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: detect
    # Only run the full ~15-min build+release when the detect job says app code
    # actually changed (or it was a manual dispatch).
    if: ${{ needs.detect.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # A cold build is ~10-15 min. The patch fallback can run TWO builds in one
    # job (a rejected patch, then a full release), so the cap has to cover both
    # — 60 still stops a hung run far short of the 6h runner default.
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Check out the private source
        uses: actions/checkout@v7
        with:
          repository: Karthik77-kk/kfit-app
          # The exact commit detect classified. Resolving 'main' again here
          # would let a merge landing mid-run produce an APK whose contents do
          # not match the mode that was decided for it.
          ref: ${{ needs.detect.outputs.sha }}
          token: ${{ secrets.KFIT_APP_TOKEN }}
          fetch-depth: 0   # full history so the commit count (=versionCode) is correct
          persist-credentials: false

      - name: Compute version (auto, ascending)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}   # to read the latest release on the public kfit repo
        run: |
          # versionCode = number of commits on main — strictly increases every merge,
          # so we never hand-bump pubspec and PRs can never collide on a version.
          CODE=$(git rev-list --count HEAD)
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/+.*//')
          # Ascending semantic-looking tag: v<major.minor>.<code>  e.g. v2.3.239
          TAG="v${NAME%.*}.${CODE}"
          echo "code=${CODE}"  >> $GITHUB_OUTPUT
          echo "tag=${TAG}"    >> $GITHUB_OUTPUT
          echo "label=${TAG}"  >> $GITHUB_OUTPUT
          echo "Release will be ${TAG} (versionCode ${CODE})"

          # For a PATCH we must target the version users are actually RUNNING — i.e.
          # the last published RELEASE, not this commit count. Patches don't cut a
          # release, so after Dart-only merges the count drifts ahead of the release.
          # Shorebird identifies a release as "<versionName>+<versionCode>"; derive the
          # code from the latest kfit release tag (v3.0.331 -> 331 -> 3.0.0+331).
          if [ "${{ needs.detect.outputs.mode }}" = "patch" ]; then
            LT=$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName 2>/dev/null || true)
            LC="${LT##*.}"
            if printf '%s' "$LC" | grep -qE '^[0-9]+$'; then
              echo "release_version=${NAME}+${LC}" >> $GITHUB_OUTPUT
              echo "Patch will target release ${NAME}+${LC} (from ${LT})"
            else
              echo "::error::Could not determine a release to patch (latest kfit tag='${LT}'). A patch needs an existing release baseline."
              exit 1
            fi
          fi

      - name: Pre-flight checks (fail fast, before the ~10min build)
        # Catches exactly the two failure modes hit on 2026-07-04: a corrupted/
        # empty signing secret (discovered ~13min into a build as a cryptic
        # Gradle "keystore password was incorrect") and a revoked RELEASE_PAT
        # (discovered only at the final release-publish step, after the whole
        # APK was already built). Both now fail in seconds, with a clear cause.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
          GH_BACKUP_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          GH_BACKUP_REPO: ${{ secrets.GH_BACKUP_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KFIT_APP_TOKEN: ${{ secrets.KFIT_APP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          fail=0
          # kfit-app is a single known deployment, not a general template — every
          # one of these is expected to always be set. An empty value here means
          # a secret got lost/miscopied (e.g. during a future repo/secret
          # migration like 2026-07-04's), not a legitimate "feature disabled"
          # state, so it fails the build rather than silently shipping a build
          # with a dead feature (e.g. cloud backup or AI meal scan quietly broken
          # for every user with no CI signal at all).
          #
          # SUPABASE_URL and SUPABASE_ANON_KEY are on this list DELIBERATELY,
          # and were not on the private repo's version. In the app they are
          # optional by design — absent, they decode to empty, the app reads
          # "no cloud project", and Settings offers to configure one by hand.
          # That is correct for the app and lethal for a release build: without
          # this line the build goes GREEN and ships an APK with cloud sync
          # silently unconfigured for every user who never configured it by
          # hand. Exactly the "dead feature, no CI signal" failure the rest of
          # this pre-flight exists to prevent. They live only in kfit-app's
          # secret store, and secrets cannot be read back through any API, so
          # moving the build here means they must be added here too.
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      HF_TOKEN FDC_API_KEY GH_BACKUP_TOKEN GH_BACKUP_REPO GEMINI_API_KEY \
                      SUPABASE_URL SUPABASE_ANON_KEY; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::error::Secret $name is empty. Check it's still set on this repo (Settings → Secrets and variables → Actions)."
              fail=1
            fi
          done
          # A valid PKCS12 keystore's base64 form starts with "MII" (DER SEQUENCE
          # tag). A short/garbled value here means the secret got corrupted.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ "${#ANDROID_KEYSTORE_BASE64}" -lt 100 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 looks too short (${#ANDROID_KEYSTORE_BASE64} chars) to be a real keystore. It may be corrupted."
            fail=1
          fi
          # Sanity bound, not an emptiness check: the actual 2026-07-04 incident
          # was a botched text-extraction that left the password/alias secrets
          # holding ~80+ chars of leaked config lines, not an empty value — an
          # emptiness-only check would have missed it. Real passwords/aliases
          # are never this long, so this catches the same failure class without
          # hardcoding the real (short) expected values into a CI script.
          if [ "${#ANDROID_KEYSTORE_PASSWORD}" -gt 200 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is implausibly long (${#ANDROID_KEYSTORE_PASSWORD} chars) — likely corrupted with leaked extra text."
            fail=1
          fi
          if [ "${#ANDROID_KEY_ALIAS}" -gt 200 ]; then
            echo "::error::ANDROID_KEY_ALIAS is implausibly long (${#ANDROID_KEY_ALIAS} chars) — likely corrupted with leaked extra text."
            fail=1
          fi
          # The release is published to THIS repo now, so the built-in token can
          # do it and there is no PAT left to expire or be revoked. Kept as a
          # check anyway because `permissions: contents: write` on the job is
          # easy to lose in an edit, and losing it fails at the very last step
          # after the whole ~12 minute build.
          if ! gh api "repos/${{ github.repository }}" --jq .name >/dev/null 2>&1; then
            echo "::error::github.token cannot read ${{ github.repository }} — check the job's permissions block."
            fail=1
          fi
          # Reading the private source is what the build actually depends on.
          if [ -z "${KFIT_APP_TOKEN:-}" ] || ! GH_TOKEN="$KFIT_APP_TOKEN" gh api "repos/${PRIVATE_REPO}" --jq .name >/dev/null 2>&1; then
            echo "::error::KFIT_APP_TOKEN cannot read ${PRIVATE_REPO}. The build cannot check out the source without it."
            fail=1
          fi
          # Catch a version-tag race early rather than failing at the final
          # release-creation step after the full build already ran. Only check
          # if the token itself is valid — an already-failed auth check above
          # would make this call fail for the wrong reason and double-report.
          if [ -n "$GITHUB_TOKEN" ] && gh api "repos/${{ github.repository }}/releases/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.ver.outputs.tag }} already exists on kfit — another build already published it (likely a concurrent/duplicate trigger). Nothing to do here."
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "✅ Pre-flight checks passed"
          fi
          exit "$fail"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.44.5+ is required by Shorebird's patch rollout/adoption system —
          # a release built on an older Flutter can't report which patch a
          # device is running, so patches never actually roll out (0 downloads).
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      - name: Reclaim disk + Gradle network resilience (Shorebird build is heavy)
        # MUST run BEFORE the Gradle/flutter_gemma cache restore below. Shorebird
        # downloads a SECOND Flutter (~2 GB) and builds an app bundle with ALL THREE
        # ABIs (arm/arm64/x64), and the restored cache itself has grown multi-GB —
        # together they overrun the runner's ~14 GB free space ("No space left on
        # device", now hit at the cache-restore step, previously at
        # packageReleaseBundle). Reclaim ~20-30 GB by deleting preinstalled toolchains
        # we never use — WITHOUT touching the Android SDK, Temurin Java, or Flutter
        # (the build needs those; note we delete only the CodeQL entry under
        # hostedtoolcache, never the whole cache). Also harden Gradle against the
        # transient Maven read-timeout: retry slow artifact fetches with backoff
        # instead of failing the whole resolution.
        run: |
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/microsoft \
                      /usr/local/share/boost /usr/local/graalvm \
                      /usr/local/share/powershell /usr/lib/google-cloud-sdk 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          echo "disk after:"; df -h / | tail -1
          mkdir -p "$HOME/.gradle"
          {
            echo "systemProp.org.gradle.internal.http.socketTimeout=120000"
            echo "systemProp.org.gradle.internal.http.connectionTimeout=120000"
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=500"
            # Speed: run independent Gradle tasks in parallel and reuse the build
            # cache across runs (with the Gradle cache action already keyed on
            # pubspec.lock). Trims a few minutes off the heavier Shorebird build.
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Cache Gradle & native dependencies
        # Gradle's own dependency cache and flutter_gemma's downloaded native
        # libs (~90 MB of MediaPipe/litertlm binaries) aren't covered by the
        # flutter-action cache above, so every build on a fresh runner
        # re-downloads them from scratch. The Gradle config that determines the
        # dependency set is generated inline from build_apk.yml (not a
        # committed android/ file), so that's what the key is derived from.
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/flutter_gemma
            ~/.pub-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/build_apk.yml', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Android scaffold (preserving committed android/)
        run: |
          # Back up our committed android/ (has correct manifest, BootReceiver, and build config)
          cp -r android android_committed
          cp pubspec.yaml pubspec_backup.yaml
          cp -r lib lib_backup
          flutter create --project-name kfit --no-pub .
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib
          cp -r lib_backup lib
          rm -rf lib_backup pubspec_backup.yaml
          # Restore committed files that flutter create overwrites
          cp android_committed/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Replace flutter-create kotlin sources entirely to avoid duplicate BootReceiver.kt.
          # flutter create does not delete non-template files, so BootReceiver.kt survives
          # at its committed path while the bash one-liner also placed a copy at the wrong
          # path (com/BootReceiver.kt) — causing a Kotlin Redeclaration error at compile time.
          rm -rf android/app/src/main/kotlin/
          cp -r android_committed/app/src/main/kotlin/ android/app/src/main/kotlin/
          # Restore committed Gradle/Kotlin/AGP versions (already at 9.1, 9.0.1, 2.3.20)
          cp android_committed/settings.gradle.kts android/settings.gradle.kts
          cp android_committed/build.gradle.kts android/build.gradle.kts
          cp android_committed/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          rm -rf android_committed
          echo "=== settings.gradle.kts ==="
          cat android/settings.gradle.kts
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure app signing + patch app name
        # Keystore + credentials come from encrypted repo secrets (moved out of this
        # file — it used to hold the base64 keystore and its plaintext password
        # directly in committed source, which any repo viewer could read). Same
        # signing key as always, so existing installs keep updating in place.
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Decode persistent keystore (same key every build = APK updates in place)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/kfitness.jks

          # Certificate fingerprint (SHA-256 of the DER-encoded cert, not the private
          # key) baked into the app so it can recognize its own official build at
          # runtime. This is public identifying info, not a secret — the same value
          # apps routinely hand to Firebase/Play Console/Maps API key restrictions.
          SHA256=$(keytool -list -v -keystore android/app/kfitness.jks \
              -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$SHA256" ]; then
            echo "::error::Could not read the signing certificate's SHA-256 fingerprint from the keystore."
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          # Create key.properties
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=kfitness.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

          # Write complete known-good build.gradle using a list of lines (no triple-quote
          # block that would violate YAML indentation rules for run: | blocks).
          python3 - << 'PYEOF'
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              os.remove(kts)
              print('Removed build.gradle.kts')
          lines = [
              'plugins {',
              '    id "com.android.application"',
              '    id "kotlin-android"',
              '    id "dev.flutter.flutter-gradle-plugin"',
              '}',
              '',
              'def keystoreProperties = new Properties()',
              "def keystorePropertiesFile = rootProject.file('key.properties')",
              'if (keystorePropertiesFile.exists()) {',
              '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))',
              '}',
              '',
              'android {',
              '    namespace "com.example.karthik_fitness"',
              '    compileSdk flutter.compileSdkVersion',
              '    ndkVersion flutter.ndkVersion',
              '',
              '    compileOptions {',
              '        coreLibraryDesugaringEnabled true',
              '        sourceCompatibility JavaVersion.VERSION_11',
              '        targetCompatibility JavaVersion.VERSION_11',
              '    }',
              '',
              '    kotlinOptions {',
              '        jvmTarget = "11"',
              '    }',
              '',
              '    defaultConfig {',
              '        applicationId "com.example.karthik_fitness"',
              '        minSdk flutter.minSdkVersion',
              '        targetSdk flutter.targetSdkVersion',
              '        versionCode flutter.versionCode',
              '        versionName flutter.versionName',
              '        ndk {',
              '            abiFilters "arm64-v8a"',
              '        }',
              '    }',
              '',
              '    signingConfigs {',
              '        release {',
              "            keyAlias keystoreProperties['keyAlias']",
              "            keyPassword keystoreProperties['keyPassword']",
              "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null",
              "            storePassword keystoreProperties['storePassword']",
              '        }',
              '    }',
              '',
              '    buildTypes {',
              '        release {',
              '            signingConfig signingConfigs.release',
              '            minifyEnabled false',
              '            shrinkResources false',
              '        }',
              '    }',
              '',
              '    // Strip non-arm64 native libs at packaging. --target-platform',
              '    // android-arm64 only drops Flutter-built libs; the MediaPipe/',
              '    // flutter_gemma .so ship inside an AAR and are packaged by Gradle,',
              '    // which ndk.abiFilters does NOT filter — this does (~46 MB saved).',
              '    packagingOptions {',
              '        jniLibs {',
              "            excludes += ['**/x86_64/**', '**/armeabi-v7a/**']",
              '        }',
              '    }',
              '}',
              '',
              '// Belt-and-suspenders against a duplicate arm64-v8a/libapp.so during',
              '// JNI staging. The PRIMARY guard is not double-passing',
              '// --target-platform to Shorebird (see the build step) so the target',
              '// platforms stay distinct. Additionally: Flutter 3.44.5+ stages JNI',
              '// libs with a typed CopyFlutterJniLibsTask (a DefaultTask with no',
              '// settable duplicatesStrategy) that aborts if an ABI is listed twice,',
              '// so de-dupe its targetPlatforms. Older Flutter used a Copy task',
              '// instead — there set duplicatesStrategy = EXCLUDE.',
              'tasks.matching { it.name.startsWith("copyJniLibs") }.configureEach {',
              '    if (it.hasProperty("targetPlatforms")) {',
              '        if (it.targetPlatforms.isPresent()) {',
              '            it.targetPlatforms.set(it.targetPlatforms.get().unique(false))',
              '        }',
              '    } else if (it.hasProperty("duplicatesStrategy")) {',
              '        it.duplicatesStrategy = DuplicatesStrategy.EXCLUDE',
              '    }',
              '}',
              '',
              'flutter {',
              '    source "../.."',
              '}',
              '',
              'dependencies {',
              '    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
              '}',
              '',
              'configurations.all {',
              '    exclude group: "com.google.mediapipe", module: "tasks-vision-image-generator"',
              '}',
          ]
          open(groovy, 'w').write('\n'.join(lines) + '\n')
          print('build.gradle written with release signing + desugaring')
          PYEOF

          # Patch app label to "K"
          sed -i 's/android:label="[^"]*"/android:label="K"/' android/app/src/main/AndroidManifest.xml

          # Patch AndroidManifest with required permissions (pedometer only).
          python3 - << 'PYEOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          txt = open(path).read()
          needed = [
              'android.permission.ACTIVITY_RECOGNITION',
          ]
          anchor = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = anchor
          for p in needed:
              if p not in txt:
                  perms += f'\n    <uses-permission android:name="{p}"/>'
          txt = txt.replace(anchor, perms, 1)
          open(path, 'w').write(txt)
          print('Manifest patched with pedometer permission')
          PYEOF

          echo "=== Signing + label + permissions configured ==="

      - name: Patch MainActivity for battery optimization method channel
        run: |
          # Find and replace the generated MainActivity.kt with one that exposes
          # battery optimization and notification settings via method channel
          python3 - << 'PYEOF'
          import os, glob
          # Find MainActivity.kt
          matches = glob.glob('android/app/src/main/kotlin/**/*.kt', recursive=True)
          main_activity = next((f for f in matches if 'MainActivity' in f), None)
