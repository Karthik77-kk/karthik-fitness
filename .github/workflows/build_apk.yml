name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Serialize releases. Two builds racing (e.g. a manual re-run overlapping a
# real merge) can compute the same version tag — versionCode is derived from
# commit count, so two runs checking out around the same time can land on an
# identical number. cancel-in-progress: false queues instead of racing; if
# several merges land faster than the ~10min build, GitHub keeps only the
# most recently queued run and drops earlier pending ones (not the running
# one) — no commits are lost, they just ship together in the next release
# that actually runs, rather than each merge getting its own APK.
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  # Dynamic build gate: decide at RUNTIME whether this push actually changed
  # anything that can affect the APK. A merge that only touched docs, CI config,
  # the website, or tests produces a functionally-identical APK — building and
  # releasing it just prompts every user to "update" for nothing and burns ~15
  # min of runner time. This computes the real changed-file set for the push
  # (its before→after range) and only lets the build job run when app code moved.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # read the merged PR's labels for [patch]/[full-release] overrides
    outputs:
      build: ${{ steps.check.outputs.build }}
      mode:  ${{ steps.check.outputs.mode }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide build mode (skip / silent patch / full release)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # HYBRID SHOREBIRD GATE. Three outcomes:
          #   skip    — no app-relevant change (docs/website/tests only). No build.
          #   patch   — Dart-ONLY change → `shorebird patch`: a tiny silent OTA applied
          #             on next launch, no APK, no GitHub release, no version bump.
          #   release — native/deps/assets/android/workflow change (or a manual run) →
          #             full `shorebird release`: new APK + GitHub release (this is the
          #             only path that can create a patch baseline).
          # A patch can ONLY carry Dart; it rides on the installed release's identical
          # native code, so the classification MUST be conservative — anything that is
          # not purely under lib/ falls through to a full release.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || \
             ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Can't compute a diff → full release (also validates the workflow itself).
            MODE=release
            echo "reason=manual/dispatch or no valid base — full release"
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
            echo "Changed files in this push:"; echo "$FILES"
            # Only files that actually go into / affect the APK matter here.
            APP_FILES=$(echo "$FILES" | grep -E '^(lib/|android/|assets/|pubspec\.(yaml|lock)$|\.github/workflows/build_apk\.yml$)' || true)

            # Manual overrides via the merged PR's labels (Rule 23 — computed, but
            # you can force either way). Look up the PR(s) associated with this
            # merge commit; empty/permission-less lookup just means "no override".
            LABELS=$(gh api "repos/${{ github.repository }}/commits/${AFTER}/pulls" \
                       --jq '.[].labels[].name' 2>/dev/null | tr '\n' ' ' || true)
            echo "PR labels: ${LABELS:-<none>}"

            if echo " $LABELS " | grep -q ' full-release '; then
              MODE=release; echo "reason=forced by [full-release] label"
            elif echo " $LABELS " | grep -q ' patch '; then
              MODE=patch;   echo "reason=forced by [patch] label"
            elif [ -z "$APP_FILES" ]; then
              MODE=skip;    echo "reason=no app-relevant files — skipping"
            elif echo "$APP_FILES" | grep -qvE '^lib/'; then
              MODE=release; echo "reason=native/deps/assets/android/workflow changed — full release"
            else
              MODE=patch;   echo "reason=Dart-only (all app changes under lib/) — silent patch"
            fi
          fi

          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          [ "$MODE" = "skip" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          echo "### Build gate: **${{ steps.check.outputs.mode }}**" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: detect
    # Only run the full ~15-min build+release when the detect job says app code
    # actually changed (or it was a manual dispatch).
    if: ${{ needs.detect.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # A cold build is ~10-15 min; 45 is generous headroom while still capping a
    # hung run well under the 6h runner default.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the commit count (=versionCode) is correct

      - name: Compute version (auto, ascending)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}   # to read the latest release on the public kfit repo
        run: |
          # versionCode = number of commits on main — strictly increases every merge,
          # so we never hand-bump pubspec and PRs can never collide on a version.
          CODE=$(git rev-list --count HEAD)
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/+.*//')
          # Ascending semantic-looking tag: v<major.minor>.<code>  e.g. v2.3.239
          TAG="v${NAME%.*}.${CODE}"
          echo "code=${CODE}"  >> $GITHUB_OUTPUT
          echo "tag=${TAG}"    >> $GITHUB_OUTPUT
          echo "label=${TAG}"  >> $GITHUB_OUTPUT
          echo "Release will be ${TAG} (versionCode ${CODE})"

          # For a PATCH we must target the version users are actually RUNNING — i.e.
          # the last published RELEASE, not this commit count. Patches don't cut a
          # release, so after Dart-only merges the count drifts ahead of the release.
          # Shorebird identifies a release as "<versionName>+<versionCode>"; derive the
          # code from the latest kfit release tag (v3.0.331 -> 331 -> 3.0.0+331).
          if [ "${{ needs.detect.outputs.mode }}" = "patch" ]; then
            LT=$(gh release view --repo Karthik77-kk/kfit --json tagName --jq .tagName 2>/dev/null || true)
            LC="${LT##*.}"
            if printf '%s' "$LC" | grep -qE '^[0-9]+$'; then
              echo "release_version=${NAME}+${LC}" >> $GITHUB_OUTPUT
              echo "Patch will target release ${NAME}+${LC} (from ${LT})"
            else
              echo "::error::Could not determine a release to patch (latest kfit tag='${LT}'). A patch needs an existing release baseline."
              exit 1
            fi
          fi

      - name: Pre-flight checks (fail fast, before the ~10min build)
        # Catches exactly the two failure modes hit on 2026-07-04: a corrupted/
        # empty signing secret (discovered ~13min into a build as a cryptic
        # Gradle "keystore password was incorrect") and a revoked RELEASE_PAT
        # (discovered only at the final release-publish step, after the whole
        # APK was already built). Both now fail in seconds, with a clear cause.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
          GH_BACKUP_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          GH_BACKUP_REPO: ${{ secrets.GH_BACKUP_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          fail=0
          # kfit-app is a single known deployment, not a general template — every
          # one of these is expected to always be set. An empty value here means
          # a secret got lost/miscopied (e.g. during a future repo/secret
          # migration like 2026-07-04's), not a legitimate "feature disabled"
          # state, so it fails the build rather than silently shipping a build
          # with a dead feature (e.g. cloud backup or AI meal scan quietly broken
          # for every user with no CI signal at all).
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      HF_TOKEN FDC_API_KEY GH_BACKUP_TOKEN GH_BACKUP_REPO GEMINI_API_KEY; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::error::Secret $name is empty. Check it's still set on this repo (Settings → Secrets and variables → Actions)."
              fail=1
            fi
          done
          # A valid PKCS12 keystore's base64 form starts with "MII" (DER SEQUENCE
          # tag). A short/garbled value here means the secret got corrupted.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ "${#ANDROID_KEYSTORE_BASE64}" -lt 100 ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 looks too short (${#ANDROID_KEYSTORE_BASE64} chars) to be a real keystore. It may be corrupted."
            fail=1
          fi
          # Sanity bound, not an emptiness check: the actual 2026-07-04 incident
          # was a botched text-extraction that left the password/alias secrets
          # holding ~80+ chars of leaked config lines, not an empty value — an
          # emptiness-only check would have missed it. Real passwords/aliases
          # are never this long, so this catches the same failure class without
          # hardcoding the real (short) expected values into a CI script.
          if [ "${#ANDROID_KEYSTORE_PASSWORD}" -gt 200 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is implausibly long (${#ANDROID_KEYSTORE_PASSWORD} chars) — likely corrupted with leaked extra text."
            fail=1
          fi
          if [ "${#ANDROID_KEY_ALIAS}" -gt 200 ]; then
            echo "::error::ANDROID_KEY_ALIAS is implausibly long (${#ANDROID_KEY_ALIAS} chars) — likely corrupted with leaked extra text."
            fail=1
          fi
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_PAT is empty. Cross-repo release publishing to kfit will fail."
            fail=1
          elif ! gh api repos/Karthik77-kk/kfit --jq .name >/dev/null 2>&1; then
            echo "::error::RELEASE_PAT can't read Karthik77-kk/kfit (revoked, expired, or missing permission). Generate a replacement fine-grained PAT (Contents + Pull requests: read/write on both kfit and kfit-app) and update the RELEASE_PAT secret before this can release."
            fail=1
          fi
          # Catch a version-tag race early rather than failing at the final
          # release-creation step after the full build already ran. Only check
          # if the token itself is valid — an already-failed auth check above
          # would make this call fail for the wrong reason and double-report.
          if [ -n "$GITHUB_TOKEN" ] && gh api "repos/Karthik77-kk/kfit/releases/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.ver.outputs.tag }} already exists on kfit — another build already published it (likely a concurrent/duplicate trigger). Nothing to do here."
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "✅ Pre-flight checks passed"
          fi
          exit "$fail"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Cache Gradle & native dependencies
        # Gradle's own dependency cache and flutter_gemma's downloaded native
        # libs (~90 MB of MediaPipe/litertlm binaries) aren't covered by the
        # flutter-action cache above, so every build on a fresh runner
        # re-downloads them from scratch. The Gradle config that determines the
        # dependency set is generated inline from build_apk.yml (not a
        # committed android/ file), so that's what the key is derived from.
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/flutter_gemma
            ~/.pub-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('.github/workflows/build_apk.yml', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Android scaffold (preserving committed android/)
        run: |
          # Back up our committed android/ (has correct manifest, BootReceiver, and build config)
          cp -r android android_committed
          cp pubspec.yaml pubspec_backup.yaml
          cp -r lib lib_backup
          flutter create --project-name kfit --no-pub .
          cp pubspec_backup.yaml pubspec.yaml
          rm -rf lib
          cp -r lib_backup lib
          rm -rf lib_backup pubspec_backup.yaml
          # Restore committed files that flutter create overwrites
          cp android_committed/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Replace flutter-create kotlin sources entirely to avoid duplicate BootReceiver.kt.
          # flutter create does not delete non-template files, so BootReceiver.kt survives
          # at its committed path while the bash one-liner also placed a copy at the wrong
          # path (com/BootReceiver.kt) — causing a Kotlin Redeclaration error at compile time.
          rm -rf android/app/src/main/kotlin/
          cp -r android_committed/app/src/main/kotlin/ android/app/src/main/kotlin/
          # Restore committed Gradle/Kotlin/AGP versions (already at 9.1, 9.0.1, 2.3.20)
          cp android_committed/settings.gradle.kts android/settings.gradle.kts
          cp android_committed/build.gradle.kts android/build.gradle.kts
          cp android_committed/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          rm -rf android_committed
          echo "=== settings.gradle.kts ==="
          cat android/settings.gradle.kts
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure app signing + patch app name
        # Keystore + credentials come from encrypted repo secrets (moved out of this
        # file — it used to hold the base64 keystore and its plaintext password
        # directly in committed source, which any repo viewer could read). Same
        # signing key as always, so existing installs keep updating in place.
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Decode persistent keystore (same key every build = APK updates in place)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/kfitness.jks

          # Certificate fingerprint (SHA-256 of the DER-encoded cert, not the private
          # key) baked into the app so it can recognize its own official build at
          # runtime. This is public identifying info, not a secret — the same value
          # apps routinely hand to Firebase/Play Console/Maps API key restrictions.
          SHA256=$(keytool -list -v -keystore android/app/kfitness.jks \
              -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$SHA256" ]; then
            echo "::error::Could not read the signing certificate's SHA-256 fingerprint from the keystore."
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          # Create key.properties
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=kfitness.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties

          # Write complete known-good build.gradle using a list of lines (no triple-quote
          # block that would violate YAML indentation rules for run: | blocks).
          python3 - << 'PYEOF'
          import os
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              os.remove(kts)
              print('Removed build.gradle.kts')
          lines = [
              'plugins {',
              '    id "com.android.application"',
              '    id "kotlin-android"',
              '    id "dev.flutter.flutter-gradle-plugin"',
              '}',
              '',
              'def keystoreProperties = new Properties()',
              "def keystorePropertiesFile = rootProject.file('key.properties')",
              'if (keystorePropertiesFile.exists()) {',
              '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))',
              '}',
              '',
              'android {',
              '    namespace "com.example.karthik_fitness"',
              '    compileSdk flutter.compileSdkVersion',
              '    ndkVersion flutter.ndkVersion',
              '',
              '    compileOptions {',
              '        coreLibraryDesugaringEnabled true',
              '        sourceCompatibility JavaVersion.VERSION_11',
              '        targetCompatibility JavaVersion.VERSION_11',
              '    }',
              '',
              '    kotlinOptions {',
              '        jvmTarget = "11"',
              '    }',
              '',
              '    defaultConfig {',
              '        applicationId "com.example.karthik_fitness"',
              '        minSdk flutter.minSdkVersion',
              '        targetSdk flutter.targetSdkVersion',
              '        versionCode flutter.versionCode',
              '        versionName flutter.versionName',
              '        ndk {',
              '            abiFilters "arm64-v8a"',
              '        }',
              '    }',
              '',
              '    signingConfigs {',
              '        release {',
              "            keyAlias keystoreProperties['keyAlias']",
              "            keyPassword keystoreProperties['keyPassword']",
              "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null",
              "            storePassword keystoreProperties['storePassword']",
              '        }',
              '    }',
              '',
              '    buildTypes {',
              '        release {',
              '            signingConfig signingConfigs.release',
              '            minifyEnabled false',
              '            shrinkResources false',
              '        }',
              '    }',
              '',
              '    // Strip non-arm64 native libs at packaging. --target-platform',
              '    // android-arm64 only drops Flutter-built libs; the MediaPipe/',
              '    // flutter_gemma .so ship inside an AAR and are packaged by Gradle,',
              '    // which ndk.abiFilters does NOT filter — this does (~46 MB saved).',
              '    packagingOptions {',
              '        jniLibs {',
              "            excludes += ['**/x86_64/**', '**/armeabi-v7a/**']",
              '        }',
              '    }',
              '}',
              '',
              '// Shorebird builds an app bundle (bundleRelease) for its release',
              "// baseline; on Gradle 9.x the Flutter plugin's copyJniLibs Copy task",
              '// aborts on a duplicate arm64-v8a/libapp.so with no strategy set.',
              '// EXCLUDE keeps the first and drops the dup (the lib is still packaged',
              '// once) — scoped to copyJniLibs so no other copy task is affected.',
              'tasks.matching { it.name.startsWith("copyJniLibs") }.configureEach {',
              '    duplicatesStrategy = DuplicatesStrategy.EXCLUDE',
              '}',
              '',
              'flutter {',
              '    source "../.."',
              '}',
              '',
              'dependencies {',
              '    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
              '}',
              '',
              'configurations.all {',
              '    exclude group: "com.google.mediapipe", module: "tasks-vision-image-generator"',
              '}',
          ]
          open(groovy, 'w').write('\n'.join(lines) + '\n')
          print('build.gradle written with release signing + desugaring')
          PYEOF

          # Patch app label to "K"
          sed -i 's/android:label="[^"]*"/android:label="K"/' android/app/src/main/AndroidManifest.xml

          # Patch AndroidManifest with required permissions (pedometer only).
          python3 - << 'PYEOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          txt = open(path).read()
          needed = [
              'android.permission.ACTIVITY_RECOGNITION',
          ]
          anchor = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = anchor
          for p in needed:
              if p not in txt:
                  perms += f'\n    <uses-permission android:name="{p}"/>'
          txt = txt.replace(anchor, perms, 1)
          open(path, 'w').write(txt)
          print('Manifest patched with pedometer permission')
          PYEOF

          echo "=== Signing + label + permissions configured ==="

      - name: Patch MainActivity for battery optimization method channel
        run: |
          # Find and replace the generated MainActivity.kt with one that exposes
          # battery optimization and notification settings via method channel
          python3 - << 'PYEOF'
          import os, glob
          # Find MainActivity.kt
          matches = glob.glob('android/app/src/main/kotlin/**/*.kt', recursive=True)
          main_activity = next((f for f in matches if 'MainActivity' in f), None)
          if not main_activity:
              print('MainActivity.kt not found, skipping')
          else:
              pkg_line = open(main_activity).readline().strip()  # package com.example.xxx
              lines = [
                  pkg_line,
                  '',
                  'import android.content.Intent',
                  'import android.content.pm.PackageManager',
                  'import android.net.Uri',
                  'import android.os.Build',
                  'import android.os.PowerManager',
                  'import android.provider.Settings',
                  'import io.flutter.embedding.android.FlutterActivity',
                  'import io.flutter.embedding.engine.FlutterEngine',
                  'import io.flutter.plugin.common.MethodChannel',
                  'import java.security.MessageDigest',
                  '',
                  '@Suppress("DEPRECATION")',
                  'class MainActivity: FlutterActivity() {',
                  '    private val CHANNEL = "com.kfitness/battery"',
                  '    private val INTEGRITY_CHANNEL = "com.kfitness/integrity"',
                  '',
                  '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {',
                  '        super.configureFlutterEngine(flutterEngine)',
                  '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)',
                  '            .setMethodCallHandler { call, result ->',
                  '                when (call.method) {',
                  '                    "requestIgnoreBatteryOptimizations" -> {',
                  '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {',
                  '                            val pm = getSystemService(POWER_SERVICE) as PowerManager',
                  '                            if (!pm.isIgnoringBatteryOptimizations(packageName)) {',
                  '                                val intent = Intent(',
                  '                                    Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
                  '                                )',
                  '                                intent.data = Uri.parse("package:$packageName")',
                  '                                startActivity(intent)',
                  '                            }',
                  '                        }',
                  '                        result.success(true)',
                  '                    }',
                  '                    "isIgnoringBatteryOptimizations" -> {',
                  '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {',
                  '                            val pm = getSystemService(POWER_SERVICE) as PowerManager',
                  '                            result.success(pm.isIgnoringBatteryOptimizations(packageName))',
                  '                        } else {',
                  '                            result.success(true)',
                  '                        }',
                  '                    }',
                  '                    "openNotificationSettings" -> {',
                  '                        val intent = Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)',
                  '                        intent.putExtra(Settings.EXTRA_APP_PACKAGE, packageName)',
                  '                        startActivity(intent)',
                  '                        result.success(true)',
                  '                    }',
                  '                    "openExactAlarmSettings" -> {',
                  '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {',
                  '                            val intent = Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM)',
                  '                            intent.data = Uri.parse("package:$packageName")',
                  '                            startActivity(intent)',
                  '                        }',
                  '                        result.success(true)',
                  '                    }',
                  '                    else -> result.notImplemented()',
                  '                }',
                  '            }',
                  '',
                  '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, INTEGRITY_CHANNEL)',
                  '            .setMethodCallHandler { call, result ->',
                  '                when (call.method) {',
                  '                    "getSigningSha256" -> {',
                  '                        try {',
                  '                            val sig = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {',
                  '                                val info = packageManager.getPackageInfo(',
                  '                                    packageName, PackageManager.GET_SIGNING_CERTIFICATES)',
                  '                                info.signingInfo?.apkContentsSigners?.firstOrNull()',
                  '                            } else {',
                  '                                val info = packageManager.getPackageInfo(',
                  '                                    packageName, PackageManager.GET_SIGNATURES)',
                  '                                info.signatures?.firstOrNull()',
                  '                            }',
                  '                            if (sig != null) {',
                  '                                val digest = MessageDigest.getInstance("SHA-256")',
                  '                                    .digest(sig.toByteArray())',
                  '                                val hex = digest.joinToString("") {',
                  '                                    "%02x".format(it.toInt() and 0xFF)',
                  '                                }',
                  '                                result.success(hex)',
                  '                            } else {',
                  '                                result.success("")',
                  '                            }',
                  '                        } catch (e: Exception) {',
                  '                            result.success("")',
                  '                        }',
                  '                    }',
                  '                    "getInstalledApkPath" -> {',
                  '                        try {',
                  '                            result.success(applicationInfo.sourceDir)',
                  '                        } catch (e: Exception) {',
                  '                            result.success(null)',
                  '                        }',
                  '                    }',
                  '                    else -> result.notImplemented()',
                  '                }',
                  '            }',
                  '    }',
                  '}',
              ]
              content = '\n'.join(lines) + '\n'
              open(main_activity, 'w').write(content)
              print(f'Patched {main_activity}')
          PYEOF

      - name: Verify build.gradle signing config
        run: |
          echo "=== app/build.gradle (must contain release signingConfig) ==="
          cat android/app/build.gradle
          grep -q "signingConfigs.release" android/app/build.gradle && echo "✅ Release signing confirmed" || (echo "❌ Release signing MISSING — build will use debug key!" && exit 1)

      - name: Generate adaptive + legacy launcher icons (black K on grey)
        run: |
          pip install Pillow --break-system-packages -q
          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw, ImageFont
          GREY = (90, 90, 90, 255)   # flat neutral grey background
          BLACK = (0, 0, 0, 255)     # the K
          def load_font(px):
              for fp in [
                  '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                  '/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf',
                  '/usr/share/fonts/truetype/freefont/FreeSans.ttf',
              ]:
                  if os.path.exists(fp):
                      return ImageFont.truetype(fp, px)
              return None
          def draw_k(img, frac):
              # Regular-weight 'K' centered on img; frac = glyph size / canvas.
              size = img.size[0]
              draw = ImageDraw.Draw(img)
              font = load_font(int(size * frac))
              if font:
                  b = draw.textbbox((0, 0), 'K', font=font)
                  tw, th = b[2] - b[0], b[3] - b[1]
                  draw.text(((size - tw) / 2 - b[0], (size - th) / 2 - b[1]), 'K', fill=BLACK, font=font)
              else:
                  m, s, cx = size * 0.34, max(size * 0.08, 2), size * 0.44
                  draw.rectangle([m, m, m + s, size - m], fill=BLACK)
                  draw.polygon([(cx, size*0.5), (cx+s*0.6, size*0.5), (size-m, m), (size-m-s, m)], fill=BLACK)
                  draw.polygon([(cx, size*0.5), (cx+s*0.6, size*0.5), (size-m, size-m), (size-m-s, size-m)], fill=BLACK)
              return img
          res = 'android/app/src/main/res'
          # Legacy square icons (pre-API-26): full-bleed grey + K at 56%.
          legacy = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, sz in legacy.items():
              p = res + '/' + d
              os.makedirs(p, exist_ok=True)
              sq = draw_k(Image.new('RGBA', (sz, sz), GREY), 0.56).convert('RGB')
              sq.save(p + '/ic_launcher.png')
              sq.save(p + '/ic_launcher_round.png')
          # Adaptive foreground (API 26+): transparent 108dp canvas, K at 42% so
          # it stays inside the safe zone the launcher mask crops to.
          fg = {'mipmap-mdpi': 108, 'mipmap-hdpi': 162, 'mipmap-xhdpi': 216, 'mipmap-xxhdpi': 324, 'mipmap-xxxhdpi': 432}
          for d, sz in fg.items():
              p = res + '/' + d
              os.makedirs(p, exist_ok=True)
              draw_k(Image.new('RGBA', (sz, sz), (0, 0, 0, 0)), 0.42).save(p + '/ic_launcher_foreground.png')
          # Background colour + adaptive-icon XML (foreground over grey).
          os.makedirs(res + '/values', exist_ok=True)
          with open(res + '/values/colors.xml', 'w') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#5A5A5A</color>\n</resources>\n')
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for name in ['ic_launcher.xml', 'ic_launcher_round.xml']:
              with open(res + '/mipmap-anydpi-v26/' + name, 'w') as f:
                  f.write(adaptive)
          print('Adaptive + legacy launcher icons generated')
          PYEOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Reclaim disk + Gradle network resilience (Shorebird build is heavy)
        # Shorebird downloads a SECOND Flutter (~2 GB) and builds an app bundle with
        # ALL THREE ABIs (arm/arm64/x64); with flutter_gemma's large MediaPipe .so per
        # ABI this overruns the runner's ~14 GB free space and dies at
        # packageReleaseBundle with "No space left on device". Reclaim ~20-30 GB by
        # deleting preinstalled toolchains we never use — WITHOUT touching the Android
        # SDK, Temurin Java, or Flutter (the build needs those; note we delete only the
        # CodeQL entry under hostedtoolcache, never the whole cache). Also harden Gradle
        # against the transient Maven read-timeout seen earlier: retry slow artifact
        # fetches with backoff instead of failing the whole resolution.
        run: |
          echo "disk before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /opt/microsoft \
                      /usr/local/share/boost /usr/local/graalvm \
                      /usr/local/share/powershell /usr/lib/google-cloud-sdk 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          echo "disk after:"; df -h / | tail -1
          mkdir -p "$HOME/.gradle"
          {
            echo "systemProp.org.gradle.internal.http.socketTimeout=120000"
            echo "systemProp.org.gradle.internal.http.connectionTimeout=120000"
            echo "systemProp.org.gradle.internal.repository.max.retries=8"
            echo "systemProp.org.gradle.internal.repository.initial.backoff=500"
            # Speed: run independent Gradle tasks in parallel and reuse the build
            # cache across runs (with the Gradle cache action already keyed on
            # pubspec.lock). Trims a few minutes off the heavier Shorebird build.
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Install Shorebird CLI
        # Shorebird wraps `flutter build` with its own (patched) Flutter so future
        # Dart-only changes can ship as silent over-the-air patches. It manages its
        # own Flutter in ~/.config/shorebird — coexists with the flutter-action
        # Flutter used above for `flutter create`/`pub get`. shorebird.yaml
        # (committed) + SHOREBIRD_TOKEN are the only config; no build.gradle needed.
        run: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          # PATH exports don't cross GitHub Actions steps — persist via $GITHUB_PATH.
          # The installer clones to ~/.config/shorebird (XDG); binary is bin/shorebird.
          # Locate it dynamically (Rule 23) so an installer path change can't silently
          # break us, and FAIL FAST here instead of 10 min later in the build step.
          SB_BIN="$HOME/.config/shorebird/bin"
          if [ ! -x "$SB_BIN/shorebird" ]; then
            SB_BIN="$(dirname "$(find "$HOME" -type f -name shorebird -path '*/bin/*' 2>/dev/null | head -1)")"
          fi
          test -x "$SB_BIN/shorebird" || { echo "::error::shorebird binary not found after install"; exit 1; }
          echo "$SB_BIN" >> "$GITHUB_PATH"
          "$SB_BIN/shorebird" --version

      - name: Build (Shorebird release or silent patch)
        # HYBRID BUILD. Same Flutter flags for both paths (identical native code,
        # arm64-only, obfuscation, dart-defines) so a patch is a valid diff of the
        # release it targets:
        #   release → `shorebird release android --artifact apk` — new APK carrying
        #             the Shorebird updater; published as a GitHub release below.
        #             --build-number sets versionCode from the commit count.
        #   patch   → `shorebird patch android --release-version <v>` — builds the
        #             Dart, diffs it against that release, and uploads a tiny silent
        #             OTA patch to Shorebird. NO APK, NO GitHub release, NO version
        #             bump — every publish step below is gated to release mode.
        # --target-platform android-arm64: single-ABI (Flutter-built libs); the
        # AAR .so are stripped by the gradle packaging filter. --obfuscate/
        # --split-debug-info: release hardening; symbols kept as a 1-day artifact.
        # Secrets are base64-encoded so they aren't plaintext, grep-able strings in
        # the APK (decoded at runtime, e.g. GeminiVisionService._key). GitHub sets
        # CI=true so Shorebird runs non-interactively.
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          b64() { printf '%s' "$1" | base64 -w 0; }
          # base64 -w 0 values contain no spaces, so array elements stay intact.
          FLAGS=(
            --target-platform android-arm64 --no-tree-shake-icons
            --obfuscate --split-debug-info=build/symbols
            --dart-define=HF_TOKEN_B64=$(b64 "${{ secrets.HF_TOKEN }}")
            --dart-define=FDC_API_KEY_B64=$(b64 "${{ secrets.FDC_API_KEY }}")
            --dart-define=GH_BACKUP_TOKEN_B64=$(b64 "${{ secrets.GH_BACKUP_TOKEN }}")
            --dart-define=GH_BACKUP_REPO_B64=$(b64 "${{ secrets.GH_BACKUP_REPO }}")
            --dart-define=GEMINI_API_KEY_B64=$(b64 "${{ secrets.GEMINI_API_KEY }}")
            --dart-define=EXPECTED_SIGNING_SHA256=${{ steps.sign.outputs.sha256 }}
          )
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # VALIDATION ONLY. A manual dispatch is used to check that a branch still
            # builds — it must NOT run `shorebird release`, because that permanently
            # registers versionCode N (= commit count) on Shorebird's backend, and
            # the eventual squash-merge of that branch lands on the SAME N → the real
            # release then fails "existing android release for version 3.0.0+N".
            # A plain flutter build exercises the same compile/gradle/disk path with
            # identical flags but reserves no version. (Discovered 2026-07-24: a
            # dispatch that pre-registered 3.0.0+332 blocked the merge's release.)
            echo "🔎 Validation build (dispatch) — plain flutter build, no Shorebird release registered."
            flutter build apk --release "${FLAGS[@]}" --build-number=${{ steps.ver.outputs.code }}
          elif [ "${{ needs.detect.outputs.mode }}" = "patch" ]; then
            echo "🩹 Silent patch → release ${{ steps.ver.outputs.release_version }}"
            # NOTE: `shorebird patch` has NO --flutter-version option (unlike
            # `shorebird release`). A patch inherits the exact Flutter revision
            # of its target release automatically, so pinning it here is both
            # invalid (exit 64 "Could not find an option named --flutter-version")
            # and unnecessary. Everything after `--` is proxied to `flutter build`.
            # --allow-asset-diffs: Flutter regenerates NativeAssetsManifest.json
            # per build, so a patch trips a benign asset-diff and aborts (exit 70,
            # UnpatchableChangeException). Safe here because `detect` only ever
            # patches lib/-only diffs — a real assets/ change forces release mode,
            # so a patch can never carry a legitimate asset change. Native diffs
            # are intentionally NOT allowed (they must still fail).
            shorebird patch android --allow-asset-diffs \
              --release-version="${{ steps.ver.outputs.release_version }}" \
              -- "${FLAGS[@]}"
          else
            echo "📦 Full release (versionCode ${{ steps.ver.outputs.code }})"
            shorebird release android --artifact apk --flutter-version=3.44.0 -- \
              "${FLAGS[@]}" --build-number=${{ steps.ver.outputs.code }}
          fi

      # ── Everything below publishes an APK/GitHub release → RELEASE MODE ONLY.
      # A patch produces no installable APK (it uploads a diff to Shorebird), so
      # these are all skipped for patch mode.
      - name: Upload debug symbols
        if: needs.detect.outputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols
          path: build/symbols
          retention-days: 1

      - name: Rename APK
        if: needs.detect.outputs.mode == 'release'
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/kfit.apk

      - name: Upload APK artifact
        if: needs.detect.outputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: kfit
          path: build/app/outputs/flutter-apk/kfit.apk
          # 1 day, not 30: the APK is permanently attached to the GitHub Release,
          # so this artifact is just for same-day debugging. At ~127 MB/build the
          # old 30-day retention piled up to ~6 GB and tripped the account storage
          # quota, which silently stopped Actions from dispatching new runs.
          retention-days: 1

      - name: Verify APK exists before release
        if: needs.detect.outputs.mode == 'release'
        run: |
          if [ ! -f build/app/outputs/flutter-apk/kfit.apk ]; then
            echo "❌ ERROR: kfit.apk not found at build/app/outputs/flutter-apk/kfit.apk"
            ls -lh build/app/outputs/flutter-apk/ || echo "Directory does not exist"
            exit 1
          fi
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/kfit.apk | cut -f1)
          echo "✅ APK verified: $APK_SIZE"

      - name: APK size breakdown (what's eating the size)
        if: needs.detect.outputs.mode == 'release'
        # Lists the 20 largest entries inside the APK so bloat is visible in the
        # run summary (native inference .so vs app code vs assets). uncompressed
        # bytes; the .apk itself is smaller after DEFLATE.
        run: |
          APK=build/app/outputs/flutter-apk/kfit.apk
          {
            echo "## APK size breakdown"
            echo ""
            echo "Total APK: **$(du -h "$APK" | cut -f1)**"
            echo ""
            echo "| Size (uncompressed) | File |"
            echo "|---:|---|"
            unzip -l "$APK" | awk 'NR>3 && $4!="" {printf "%d\t%s\n", $1, $4}' \
              | sort -rn | head -20 \
              | awk -F'\t' '{ mb=$1/1048576; printf "| %.1f MB | `%s` |\n", mb, $2 }'
            echo ""
            echo "_lib/**/*.so = native runtime (flutter_gemma MediaPipe/LiteRT + Flutter). The Gemma model is downloaded at runtime, not bundled._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate delta patch from previous release (best-effort, never fatal)
        id: patch
        if: needs.detect.outputs.mode == 'release'
        # DELTA UPDATE — Phase 1 (inert). The ~170 MB APK is mostly a byte-identical
        # native AI runtime; only the compiled Dart (libapp.so, a few MB) changes
        # between builds. So a binary patch from the PREVIOUS release's kfit.apk to
        # this one is tiny (~MBs). We publish it as an extra release asset so a
        # one-build-behind user can later update by downloading the patch instead of
        # the whole APK. The app IGNORES these assets until the delta-updater ships —
        # this step only produces artifacts, it changes nothing for current installs.
        #
        # Best-effort by design: ANY failure here — no previous release, no kfit.apk
        # on it, bsdiff OOM/timeout, unparseable tag — just means "no patch this
        # release"; the full kfit.apk is always published regardless. `set +e` +
        # explicit `exit 0` keep the step green on every skip path; continue-on-error
        # is a second net so a patch problem can NEVER fail or block the release.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          NEW_TAG: ${{ steps.ver.outputs.tag }}
          NEW_BUILD: ${{ steps.ver.outputs.code }}
        run: |
          set +e
          OUT=build/app/outputs/flutter-apk
          APK="$OUT/kfit.apk"
          WORK=build/patchwork
          mkdir -p "$WORK"

          # N-1 = whatever release is currently "latest": the new one isn't created
          # yet (this runs before "Create GitHub Release"), and build-and-release is a
          # serialized concurrency group, so there is no race on "latest".
          PREV_TAG=$(gh release view --repo Karthik77-kk/kfit --json tagName --jq .tagName 2>/dev/null)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release — skipping patch (nothing to diff against)."; exit 0
          fi
          echo "Delta: previous $PREV_TAG -> new $NEW_TAG"

          if ! gh release download "$PREV_TAG" --repo Karthik77-kk/kfit \
                 -p 'kfit.apk' -D "$WORK" --clobber 2>/dev/null; then
            echo "Previous release $PREV_TAG has no kfit.apk asset — skipping patch."; exit 0
          fi
          PREV="$WORK/kfit.apk"

          # bsdiff on ~170 MB wants a few GB RAM + a couple minutes (suffix sort);
          # ubuntu-latest (16 GB) fits it. timeout-box so a pathological input can't
          # hang the release build (the 45-min job cap is a blunter backstop).
          sudo apt-get update -qq >/dev/null 2>&1
          if ! sudo apt-get install -y -qq bsdiff >/dev/null 2>&1; then
            echo "bsdiff unavailable — skipping patch."; exit 0
          fi
          if ! timeout 600 bsdiff "$PREV" "$APK" "$WORK/kfit.patch"; then
            echo "bsdiff failed or timed out — skipping patch."; rm -f "$WORK/kfit.patch"; exit 0
          fi

          FULL_BYTES=$(stat -c%s "$APK")
          PATCH_BYTES=$(stat -c%s "$WORK/kfit.patch")
          # Guard (computed per-release): if the native libs shifted this build (a
          # Flutter/flutter_gemma bump), the patch approaches full size and saves
          # nothing — drop it so the app just does a normal full download.
          if [ "$PATCH_BYTES" -ge $(( FULL_BYTES * 60 / 100 )) ]; then
            echo "Patch ${PATCH_BYTES}B >= 60% of full ${FULL_BYTES}B — not worth it, skipping."; exit 0
          fi

          # build number = last dotted segment of the tag (v3.0.325 -> 325). Bail if
          # it isn't a clean integer so we never write a malformed patch.json.
          FROM_BUILD=$(printf '%s' "$PREV_TAG" | awk -F. '{print $NF}')
          if ! printf '%s' "$FROM_BUILD" | grep -qE '^[0-9]+$'; then
            echo "Could not parse a build number from tag '$PREV_TAG' — skipping patch."; exit 0
          fi

          FROM_SHA=$(sha256sum "$PREV"             | cut -d' ' -f1)
          TO_SHA=$(sha256sum "$APK"                | cut -d' ' -f1)
          PATCH_SHA=$(sha256sum "$WORK/kfit.patch" | cut -d' ' -f1)

          cp "$WORK/kfit.patch" "$OUT/kfit.patch"
          # patch.json drives the app's two SHA-256 gates: it verifies the installed
          # APK == fromSha256 before patching, and the reconstructed APK == toSha256
          # before installing. jq (not a heredoc) avoids YAML block-scalar indentation
          # pitfalls and guarantees valid JSON.
          jq -n \
            --argjson fromBuild "$FROM_BUILD" \
            --arg     fromTag   "$PREV_TAG" \
            --arg     fromSha256 "$FROM_SHA" \
            --argjson toBuild   "$NEW_BUILD" \
            --arg     toTag     "$NEW_TAG" \
            --arg     toSha256  "$TO_SHA" \
            --argjson patchSize "$PATCH_BYTES" \
            --arg     patchSha256 "$PATCH_SHA" \
            '{fromBuild:$fromBuild, fromTag:$fromTag, fromSha256:$fromSha256, toBuild:$toBuild, toTag:$toTag, toSha256:$toSha256, patchSize:$patchSize, patchSha256:$patchSha256}' \
            > "$OUT/patch.json"

          echo "patch_ready=true" >> "$GITHUB_OUTPUT"
          PMB=$(awk -v b="$PATCH_BYTES" 'BEGIN{printf "%.1f", b/1048576}')
          FMB=$(awk -v b="$FULL_BYTES"  'BEGIN{printf "%.0f", b/1048576}')
          {
            echo "## Delta patch"
            echo ""
            echo "Patch \`$PREV_TAG\` → \`$NEW_TAG\`: **${PMB} MB** (vs ${FMB} MB full APK)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compose dynamic release notes
        id: notes
        if: needs.detect.outputs.mode == 'release'
        run: |
          set -e
          # What's-new must list ONLY the commits THIS push adds — not a rolling
          # window of history. The previous fix compared against the latest
          # release tag, but releases live in the public kfit repo while this is
          # the private source repo (unrelated histories), so `PREV..HEAD` never
          # resolved and it silently fell back to HEAD~10 — dumping the last ten
          # commits' subjects into every release's changelog (the "why is it
          # showing all the old features" bug).
          #
          # `github.event.before` is main's tip immediately before this push, so
          # `before..HEAD` is exactly the newly-merged commit(s) (usually a single
          # squash commit = the PR title). Fall back to just HEAD~1 for manual /
          # first-push runs where `before` is absent or the zero-SHA.
          BEFORE_SHA="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Changelog range: ${RANGE}"
          # Each squash-merged PR is one commit whose subject is the PR title.
          # Strip the "Build N: " prefix and "(#NN)" suffix for a clean changelog.
          # Then drop internal/CI/docs/test commits so engineering-only work never
          # leaks into the user-facing "What's new" text (Rule 19): conventional
          # prefixes (ci/chore/docs/test/refactor/build/style/perf), merge/wip,
          # dependabot bumps, and subjects that are plainly about the repo/CI
          # rather than the app (release cleanup, workflows, governance, etc.).
          CHANGES=$(git log "$RANGE" --no-merges --pretty=format:'%s' \
            | sed -E 's/^Build [0-9]+:[[:space:]]*//; s/[[:space:]]*\(#[0-9]+\)$//' \
            | grep -viE '^(merge|wip|fixup|revert |bump )' \
            | grep -viE '^(ci|chore|docs|test|refactor|build|style|perf)[:(]' \
            | grep -viE '(release cleanup|weekly release|co-?author|branch protection|quality gate|governance|pipeline|workflow|keystore|dual-approval|harden|rule [0-9]+)' \
            | sed -E 's/^/- /' \
            | head -12)
          [ -z "$CHANGES" ] && CHANGES="- Under-the-hood improvements"
          # Actual APK size (dynamic — no more hardcoded ~295 MB).
          BYTES=$(stat -c%s build/app/outputs/flutter-apk/kfit.apk)
          MB=$(awk -v b="$BYTES" 'BEGIN{printf "%.0f", b/1048576}')
          {
            echo "### What's new in ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "---"
            echo "~${MB} MB · Requires Android 8.0+ · Includes on-device Gemma 3 AI model"
            echo ""
            echo "### Install"
            echo "1. Download \`kfit.apk\` below"
            echo "2. Android Settings → Install unknown apps → Allow"
            echo "3. Tap the downloaded file to install"
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Create GitHub Release with APK
        # Publishes to the public kfit repo (distribution-only), not this
        # private source repo — the website and in-app updater both point at
        # Karthik77-kk/kfit, so this is what keeps them working unchanged.
        #
        # Only on a real push to main, and only in RELEASE mode (a patch has no
        # APK to publish). A `workflow_dispatch` run (used to VALIDATE a branch —
        # e.g. the Shorebird build) still builds + uploads the APK artifact for
        # hands-on testing, but must NOT publish a user-facing release from an
        # unmerged/unverified branch.
        if: github.event_name == 'push' && needs.detect.outputs.mode == 'release'
        run: |
          OUT=build/app/outputs/flutter-apk
          ASSETS=("$OUT/kfit.apk")
          # Attach the delta patch + its metadata when this build produced one
          # (absent on the first release or a native-lib-shift build — see the
          # "Generate delta patch" step). Purely additive; kfit.apk always ships.
          if [ -f "$OUT/kfit.patch" ] && [ -f "$OUT/patch.json" ]; then
            ASSETS+=("$OUT/kfit.patch" "$OUT/patch.json")
            echo "Attaching delta patch assets: kfit.patch + patch.json"
          fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            "${ASSETS[@]}" \
            --repo Karthik77-kk/kfit \
            --title "${{ steps.ver.outputs.label }}" \
            --notes-file release_notes.md \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Job summary
        if: always()
        run: |
          if [ "${{ needs.detect.outputs.mode }}" = "patch" ]; then
            {
              echo "## 🩹 Silent patch"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Type | Shorebird OTA patch (Dart-only, no new APK/release) |"
              echo "| Applied to release | \`${{ steps.ver.outputs.release_version }}\` |"
              echo "| Users get it | automatically on next app launch |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            SIZE=$(du -h build/app/outputs/flutter-apk/kfit.apk 2>/dev/null | cut -f1 || echo "?")
            {
              echo "## 📦 Build & Release"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Release | \`${{ steps.ver.outputs.tag }}\` (versionCode ${{ steps.ver.outputs.code }}) |"
              echo "| APK size | ${SIZE} |"
              echo "| Published to | [Karthik77-kk/kfit releases](https://github.com/Karthik77-kk/kfit/releases/tag/${{ steps.ver.outputs.tag }}) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
