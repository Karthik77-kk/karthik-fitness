                  '',
                  '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, PRIVACY_CHANNEL)',
                  '            .setMethodCallHandler { call, result ->',
                  '                when (call.method) {',
                  '                    "setHideInRecents" -> {',
