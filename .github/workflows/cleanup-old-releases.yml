name: Cleanup Old Releases (kfit)

# Releases pile up on the public kfit distribution repo (every merge to main
# ships one). Keeps only the newest KEEP releases there — deletes the release
# AND its git tag for everything older. Runs cross-repo via RELEASE_PAT, the
# same token build_apk.yml already uses to publish releases to kfit.
#
# Offset an hour from cleanup-old-runs.yml's Sunday 2 AM UTC slot so the two
# scheduled jobs don't overlap.

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly, Sunday 3 AM UTC
  workflow_dispatch:

env:
  KEEP: 5
  TARGET_REPO: Karthik77-kk/kfit

permissions:
  contents: read

concurrency:
  group: cleanup-old-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Delete old releases + tags (keep newest ${{ env.KEEP }})
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_PAT is empty — can't reach $TARGET_REPO."
            exit 1
          fi

          gh api "repos/$TARGET_REPO/releases" --paginate \
            --jq '.[] | "\(.id)\t\(.tag_name)\t\(.created_at)"' \
            | sort -t $'\t' -k3 -r > releases.tsv

          total=$(wc -l < releases.tsv)
          echo "Found $total releases on $TARGET_REPO, keeping newest $KEEP."

          tail -n "+$((KEEP + 1))" releases.tsv | while IFS=$'\t' read -r id tag _created; do
            echo "Deleting $tag (release id $id)..."
            gh api -X DELETE "repos/$TARGET_REPO/releases/$id" \
              || echo "::warning::Failed to delete release $tag (id $id)"
            gh api -X DELETE "repos/$TARGET_REPO/git/refs/tags/$tag" \
              || echo "::warning::Failed to delete tag $tag"
          done

          remaining=$(gh api "repos/$TARGET_REPO/releases" --paginate --jq '.[].tag_name' | wc -l)
          echo "✅ Cleanup complete. $remaining releases remain on $TARGET_REPO."
