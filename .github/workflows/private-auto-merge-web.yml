name: Private Auto-merge (kfit-web)

# Same arrangement as private-auto-merge.yml, for kfit-web. Read that file's
# header first — the reasoning for why this polls, why it never calls
# `enablePullRequestAutoMerge` (the #145 deadlock: an arming job's own
# check-run counted toward the PR it was arming, so the PR could never become
# stable while the job was still polling for stability), and why branch
# protection stays the sole authority on whether a merge is actually allowed,
# is identical here and not repeated.
#
# A separate file for the same reason private-pr-gate-web.yml is separate from
# private-pr-gate.yml: this triggers on a DIFFERENT gate's completion
# ("Private PR Quality Gate (kfit-web)") and targets a different repo with a
# different (currently empty) exclusion surface. Folding two repos into one
# workflow.on.workflow_run trigger is not expressible cleanly, and a shared
# file would make an edit meant for one repo's merge policy a silent edit to
# the other's.
#
# ── Token, honestly ──────────────────────────────────────────────────────────
# KFIT_WEB_TOKEN is Contents:read, Pull requests:read, Commit statuses:write —
# it can post the gate's verdict but cannot merge or update a branch, exactly
# like KFIT_APP_TOKEN before it. RELEASE_PAT is reused as the write candidate,
# the same secret kfit-app's auto-merge uses — but it was scoped, by hand, in
# the GitHub web UI, to kfit-app and kfit specifically, before kfit-web
# existed. Whether it also reaches kfit-web is NOT assumed here: the same
# preflight probe used on kfit-app runs unchanged, and if RELEASE_PAT does not
# cover this repo, the sweep runs read-only and says so in the log rather than
# guessing or failing on every 10-minute tick. If that is what it reports, the
# fix is in the GitHub web UI (fine-grained PAT scope cannot be edited through
# the API) — add Karthik77-kk/kfit-web to RELEASE_PAT's repository access with
# Contents: read and write, Pull requests: read and write.

on:
  schedule:
    # Offset from private-pr-gate-web.yml's "2-59/10" so a sweep tends to land
    # a few minutes after that gate has posted its verdict, and offset again
    # from kfit-app's auto-merge ("4-59/10") so the two sweeps do not compete
    # for the same tick.
    - cron: "7-59/10 * * * *"
  workflow_run:
    workflows: ["Private PR Quality Gate (kfit-web)"]
    types: [completed]
  repository_dispatch:
    types: [private-auto-merge-web]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to act on (blank = every eligible open PR)"
        required: false
      dry_run:
        description: "Report what would happen without merging or updating"
        required: false
        type: boolean
        default: false

concurrency:
  group: private-auto-merge-web
  cancel-in-progress: false

# GITHUB_TOKEN is not used to reach the private repo at all — left read-only
# so nothing quietly starts depending on it.
permissions:
  contents: read

env:
  PRIVATE_REPO: Karthik77-kk/kfit-web
  MAX_UPDATES: "6"

jobs:
  sweep:
    name: Merge green PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preflight — pick a token that can actually merge
        id: preflight
        env:
          TOK_RELEASE: ${{ secrets.RELEASE_PAT }}
          TOK_WEB: ${{ secrets.KFIT_WEB_TOKEN }}
        run: |
          set -euo pipefail

          WRITER=none
          READER=none
          for NAME in TOK_RELEASE TOK_WEB; do
            VALUE="${!NAME:-}"
            [ -z "$VALUE" ] && continue
            PUSH=$(GH_TOKEN="$VALUE" gh api "repos/$PRIVATE_REPO" \
                     --jq '.permissions.push // false' 2>/dev/null || echo unreachable)
            case "$PUSH" in
              true)
                # "Reports", not "can" — see private-auto-merge.yml for why
                # this alone is never trusted. The 403 tracking further down
                # decides whether writing really works.
                echo "· $NAME reports write access to $PRIVATE_REPO (unverified)"
                [ "$READER" = none ] && READER="$NAME"
                WRITER="$NAME"; break ;;
              false)
                echo "· $NAME can read $PRIVATE_REPO but not write"
                [ "$READER" = none ] && READER="$NAME" ;;
              *)
                echo "· $NAME cannot reach $PRIVATE_REPO" ;;
            esac
          done

          if [ "$READER" = none ]; then
            echo "::error::No token on this repo can reach ${PRIVATE_REPO}."
            exit 1
          fi

          if [ "$WRITER" = none ]; then
            echo "::warning::No token here can write to ${PRIVATE_REPO}; running read-only."
            echo "Grant, in the GitHub web UI (fine-grained PAT permissions"
            echo "cannot be set through the API): add ${PRIVATE_REPO} to"
            echo "RELEASE_PAT's repository access, with Contents: read and"
            echo "write, plus Pull requests: read and write."
            echo ""
            echo "Prefer widening RELEASE_PAT over KFIT_WEB_TOKEN: the gate"
            echo "hands KFIT_WEB_TOKEN to a step that runs arbitrary code from"
            echo "the PR under test, whereas this job never runs PR code."
          fi

          if [ "$WRITER" != none ]; then USE="$WRITER"; else USE="$READER"; fi
          echo "Using $USE"
          echo "token=$USE"    >> "$GITHUB_OUTPUT"
          echo "writer=$WRITER" >> "$GITHUB_OUTPUT"

      - name: Sweep open PRs
        env:
          TOK_RELEASE: ${{ secrets.RELEASE_PAT }}
          TOK_WEB: ${{ secrets.KFIT_WEB_TOKEN }}
          CHOSEN_TOKEN: ${{ steps.preflight.outputs.token }}
          WRITER: ${{ steps.preflight.outputs.writer }}
          ONLY_PR: ${{ github.event.inputs.pr || github.event.client_payload.pr }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          GH_TOKEN="${!CHOSEN_TOKEN}"
          export GH_TOKEN

          USER_DRY=0
          [ "${DRY_RUN:-false}" = "true" ] && USER_DRY=1
          BLOCKED=0
          PERM_DENIED=0
          if [ "${WRITER:-none}" = "none" ]; then
            BLOCKED=1
            DRY_RUN=true
          fi

          FIELDS=number,headRefOid,headRefName,isDraft,isCrossRepository,title,author,state

          if [ -n "${ONLY_PR:-}" ]; then
            PRS=$(gh pr view "$ONLY_PR" --repo "$PRIVATE_REPO" --json "$FIELDS" | jq -c '[.]')
          else
            PRS=$(gh pr list --repo "$PRIVATE_REPO" --state open --base main \
                    --limit 50 --json "$FIELDS")
          fi

          TOTAL=$(echo "$PRS" | jq 'length')
          echo "Open PRs: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then echo "Nothing to do."; exit 0; fi

          MERGED=0; UPDATED=0; SKIPPED=0

          for row in $(echo "$PRS" | jq -r '.[] | @base64'); do
            get() { echo "$row" | base64 -d | jq -r "$1"; }
            NUM=$(get .number)
            SHA=$(get .headRefOid)
            DRAFT=$(get .isDraft)
            FORK=$(get .isCrossRepository)
            AUTHOR=$(get .author.login)
            HEAD_REF=$(get .headRefName)
            TITLE=$(get .title)

            # ── Eligibility ──────────────────────────────────────────────────

            if [ "$(get .state)" != "OPEN" ]; then
              echo "PR #$NUM: not open — skipped"; SKIPPED=$((SKIPPED+1)); continue
            fi

            if [ "$DRAFT" = "true" ]; then
              echo "PR #$NUM: draft — skipped"; SKIPPED=$((SKIPPED+1)); continue
            fi

            # Dependabot merges by hand (kfit-app's Rule 21, same reasoning
            # here): a toolchain bump must never auto-ship. Both spellings
            # matched — see private-auto-merge.yml for why the second one is
            # not defensive padding.
            case "$AUTHOR" in
              "dependabot[bot]"|"app/dependabot"|"dependabot")
                echo "PR #$NUM: dependabot — merges by hand"
                SKIPPED=$((SKIPPED+1)); continue ;;
            esac

            LT=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
            case "$LT" in
              wip:*|*"[wip]"*|*"do not merge"*|*"[skip auto-merge]"*)
                echo "PR #$NUM: title asks to skip auto-merge"; SKIPPED=$((SKIPPED+1)); continue ;;
            esac

            # kfit-web owns no schema of its own — it is a client of the SAME
            # Supabase project kfit-app manages, and has no supabase/
            # directory today. The guard is kept anyway (Rule 23: compute from
            # the actual diff, don't wait for someone to remember it), matched
            # to EXACTLY the same path as kfit-app's, not broadened.
            #
            # A first draft here matched `^supabase/` — any file anywhere under
            # the directory. That re-creates a false positive kfit-app's own
            # guard already hit and was narrowed to fix: "the private version
            # first fired on a PR that only added an edge function — nothing it
            # was built to protect against" (private-auto-merge.yml). Widening
            # under Rule 23 means computing the check dynamically FROM the
            # diff, which `migrations/` still does — it does not mean matching
            # as much as possible "to be safe". If kfit-web ever gains its own
            # edge functions or local config, those are revertible and destroy
            # nothing, exactly like kfit-app's, and should merge on green like
            # anything else.
            if ! PR_FILES=$(gh api --paginate "repos/$PRIVATE_REPO/pulls/$NUM/files" \
                              --jq '.[].filename'); then
              echo "::warning::Could not read the file list for PR #$NUM — skipping it this sweep."
              SKIPPED=$((SKIPPED+1)); continue
            fi
            if grep -q '^supabase/migrations/' <<< "$PR_FILES"; then
              echo "PR #$NUM: touches schema migrations — merges by hand"
              SKIPPED=$((SKIPPED+1)); continue
            fi

            # ── Act ──────────────────────────────────────────────────────────
            STATE=$(gh pr view "$NUM" --repo "$PRIVATE_REPO" \
                      --json mergeStateStatus --jq .mergeStateStatus \
                      || echo UNKNOWN)
            if [ "$STATE" = "UNKNOWN" ]; then
              sleep 5
              STATE=$(gh pr view "$NUM" --repo "$PRIVATE_REPO" \
                        --json mergeStateStatus --jq .mergeStateStatus \
                        || echo UNKNOWN)
            fi

            case "$STATE" in
              DIRTY)
                echo "::warning::PR #$NUM has conflicts with main and needs a manual merge."
                SKIPPED=$((SKIPPED+1)); continue ;;

              BLOCKED)
                # The required check ("Verify (build + test)") is not green
                # yet, or has not reported. This is the "only merge if
                # everything passes" behaviour — nothing below this case can
                # run until branch protection itself says the PR is clean.
                echo "PR #$NUM: blocked on required checks — waiting"
                SKIPPED=$((SKIPPED+1)); continue ;;

              BEHIND)
                if [ "$UPDATED" -ge "$MAX_UPDATES" ]; then
                  echo "::notice::PR #$NUM is behind but the update cap is reached; next sweep will take it."
                  SKIPPED=$((SKIPPED+1)); continue
                fi
                if [ "${DRY_RUN:-false}" = "true" ]; then
                  echo "[dry-run] would update PR #$NUM from main"
                  UPDATED=$((UPDATED+1)); continue
                fi
                if gh pr update-branch "$NUM" --repo "$PRIVATE_REPO" \
                     2>"${RUNNER_TEMP:-/tmp}/update_err"; then
                  echo "✅ PR #$NUM updated from main; the gate will re-run against the new head."
                  UPDATED=$((UPDATED+1))
                else
                  if grep -q "HTTP 403" "${RUNNER_TEMP:-/tmp}/update_err" 2>/dev/null; then
                    echo "::warning::PR #$NUM: branch update refused with 403 — the token cannot write to $PRIVATE_REPO."
                    PERM_DENIED=1
                    SKIPPED=$((SKIPPED+1))
                    continue
                  fi
                  echo "::warning::Could not update PR #$NUM — most likely a conflict with main."

                  MARKER="<!-- kfit-auto-merge-web:update-failed:$SHA -->"
                  PRIOR=$(gh api --paginate "repos/$PRIVATE_REPO/issues/$NUM/comments" \
                            --jq '.[].body' 2>/dev/null | grep -cF "$MARKER" || true)
                  if [ "${PRIOR:-0}" -eq 0 ]; then
                    NOTE="$MARKER"$'\n'"This branch could not be updated from \`main\` automatically, which usually means a real conflict. Merge \`main\` in locally, resolve it, and push — the gate will re-run and this will finish the job."
                    gh pr comment "$NUM" --repo "$PRIVATE_REPO" --body "$NOTE" || true
                  fi
                  SKIPPED=$((SKIPPED+1))
                fi
                continue ;;
            esac

            # CLEAN, UNSTABLE, HAS_HOOKS, or still UNKNOWN. Attempting is safe
            # in every case — if protection is not satisfied the API returns
            # 405 and nothing happens.
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[dry-run] would merge PR #$NUM (state $STATE)"
              MERGED=$((MERGED+1)); continue
            fi

            ARGS=(-X PUT "repos/$PRIVATE_REPO/pulls/$NUM/merge"
                  -f merge_method=squash
                  -f "commit_title=$TITLE (#$NUM)"
                  -f "sha=$SHA")

            # commit_message deliberately unset — see private-auto-merge.yml
            # for why supplying one here is wrong twice over. Rule 18 (no AI
            # attribution) is enforced in the gate, not laundered here.

            if gh api "${ARGS[@]}" >/dev/null 2>"${RUNNER_TEMP:-/tmp}/merge_err"; then
              echo "✅ Merged PR #$NUM"
              MERGED=$((MERGED+1))
              if [ "$FORK" != "true" ]; then
                gh api -X DELETE "repos/$PRIVATE_REPO/git/refs/heads/$HEAD_REF" \
                  >/dev/null 2>&1 || true
              fi
            else
              if grep -q "HTTP 403" "${RUNNER_TEMP:-/tmp}/merge_err" 2>/dev/null; then
                echo "::warning::PR #$NUM: merge refused with 403 — the token cannot write to $PRIVATE_REPO."
                PERM_DENIED=1
              else
                echo "::notice::PR #$NUM was not merged (state $STATE) — protection refused; the next sweep retries."
              fi
              SKIPPED=$((SKIPPED+1))
            fi
          done

          echo "Merged $MERGED, updated $UPDATED, skipped $SKIPPED."

          if [ "$PERM_DENIED" -eq 1 ]; then
            echo "::error::A merge or branch update was refused with 403: the token in use cannot write to ${PRIVATE_REPO}. See the grant described in the preflight step."
            exit 1
          fi

          if [ "$BLOCKED" -eq 1 ] && [ "$USER_DRY" -eq 0 ] && [ $((MERGED + UPDATED)) -gt 0 ]; then
            echo "::error::${MERGED} merge candidate(s) and ${UPDATED} behind branch(es) were waiting, but no token here can write to ${PRIVATE_REPO}. See the grant described in the preflight step."
            exit 1
          fi
