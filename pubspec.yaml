name: kfit
description: Personal fitness tracker - fat loss & muscle retention
publish_to: 'none'
version: 3.0.0+111

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  pedometer: ^4.1.1
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  home_widget: ^0.7.0
  flutter_gemma: ^0.16.3
  permission_handler: ^11.3.1
  http: ^1.2.0
  archive: ^4.0.9   # bzip2 decode for bsdiff delta-update patches
  crypto: ^3.0.7    # SHA-256 gates for delta-update integrity
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
  animations: ^2.2.0
  confetti: ^0.8.0
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2
  cryptography: ^2.7.0   # AES-GCM + PBKDF2 for client-side cloud-backup encryption

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/ifct_2017.json
    - shorebird.yaml
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# App launcher icon — generated via:  dart run flutter_launcher_icons
# Brand "k" mark in the app green (#30D158) on a warm off-white ground.
# Adaptive icon (Android 8+): off-white background layer + transparent green-k
# foreground (app_icon_fg.png), so the mark floats within the device's mask.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F3F1EA"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
